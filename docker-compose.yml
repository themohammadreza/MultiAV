services:
  postgres:
    image: postgres:15-alpine
    container_name: multiav-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multiav-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    build:
      context: .
      dockerfile: app/services/engines/clamav/Dockerfile
    container_name: multiav-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  windows-defender:
    image: malice/windows-defender
    container_name: multiav-windows-defender
    command: ["web"]
    ports:
      - "3993:3993"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiav-app:latest
    container_name: multiav-app
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WINDEFENDER_HOST: windows-defender
      WINDEFENDER_PORT: 3993
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?set STORAGE_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:?set STORAGE_S3_REGION}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}
      STORAGE_S3_USE_SSL: "false"
      BYPASS_AUTH: "false"
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:?set ADMIN_DEFAULT_USERNAME}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?set ADMIN_DEFAULT_PASSWORD}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:?set ADMIN_AUTH_SECRET}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      windows-defender:
        condition: service_started
      minio:
        condition: service_healthy
      
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: multiav-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: multiav
      MINIO_ROOT_PASSWORD: multiavsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiav-app:latest
    container_name: multiav-worker
    working_dir: /app
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4", "--prefetch-multiplier=1", "--max-tasks-per-child=0"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WINDEFENDER_HOST: windows-defender
      WINDEFENDER_PORT: 3993
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:?set STORAGE_S3_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:?set STORAGE_S3_REGION}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?set STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?set STORAGE_S3_SECRET_KEY}
      STORAGE_S3_USE_SSL: "false"
      BYPASS_AUTH: "false"
      ADMIN_DEFAULT_USERNAME: ${ADMIN_DEFAULT_USERNAME:?set ADMIN_DEFAULT_USERNAME}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?set ADMIN_DEFAULT_PASSWORD}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:?set ADMIN_AUTH_SECRET}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      windows-defender:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ui/web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://app:8000
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_HTTP_PROXY: ${NPM_HTTP_PROXY:-}
        NPM_HTTPS_PROXY: ${NPM_HTTPS_PROXY:-}
    image: multiav-frontend:latest
    container_name: multiav-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/"
      API_PROXY_TARGET: http://app:8000
      NEXT_PUBLIC_FEATURE_HISTORY: "true"
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./ui/admin
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://app:8000
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_HTTP_PROXY: ${NPM_HTTP_PROXY:-}
        NPM_HTTPS_PROXY: ${NPM_HTTPS_PROXY:-}
    image: multiav-admin-frontend:latest
    container_name: multiav-admin-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/"
      API_PROXY_TARGET: http://app:8000
    ports:
      - "3001:3001"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  clamav-db:
  minio-data:
