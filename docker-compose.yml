services:
  postgres:
    image: postgres:15-alpine
    container_name: multiav-postgres
    environment:
      POSTGRES_USER: multiav_user
      POSTGRES_PASSWORD: mohammad
      POSTGRES_DB: multiav_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiav_user -d multiav_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multiav-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    build:
      context: .
      dockerfile: app/services/engines/clamav/Dockerfile
    container_name: multiav-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  windows-defender:
    image: malice/windows-defender
    container_name: multiav-windows-defender
    command: ["web"]
    ports:
      - "3993:3993"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiav-app:latest
    container_name: multiav-app
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://multiav_user:mohammad@postgres:5432/multiav_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WINDEFENDER_HOST: windows-defender
      WINDEFENDER_PORT: 3993
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: multiav
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: multiav
      STORAGE_S3_SECRET_KEY: multiavsecret
      STORAGE_S3_USE_SSL: "false"
      BYPASS_AUTH: "false"
    volumes:
      - ./config:/app/config:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      windows-defender:
        condition: service_started
      minio:
        condition: service_healthy
      
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: multiav-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: multiav
      MINIO_ROOT_PASSWORD: multiavsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiav-app:latest
    container_name: multiav-worker
    working_dir: /app
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4", "--prefetch-multiplier=1", "--max-tasks-per-child=0"]
    environment:
      DATABASE_URL: postgresql://multiav_user:mohammad@postgres:5432/multiav_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      WINDEFENDER_HOST: windows-defender
      WINDEFENDER_PORT: 3993
      STORAGE_BACKEND: s3
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: multiav
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: multiav
      STORAGE_S3_SECRET_KEY: multiavsecret
      STORAGE_S3_USE_SSL: "false"
      BYPASS_AUTH: "false"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      windows-defender:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./ui/web
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://app:8000
    image: multiav-frontend:latest
    container_name: multiav-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/"
      API_PROXY_TARGET: http://app:8000
      NEXT_PUBLIC_FEATURE_HISTORY: "true"
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./ui/admin
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://app:8000
    image: multiav-admin-frontend:latest
    container_name: multiav-admin-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/"
      API_PROXY_TARGET: http://app:8000
    ports:
      - "3001:3001"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  clamav-db:
  minio-data:
